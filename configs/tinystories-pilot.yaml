# 本地 TinyStories 的 50 步 CPU 试跑；不代表充分训练的基线。
# dtype=float32、eval_batches=4、OMP/MKL 线程数=1 由运行脚本指定。
model:
  vocab_size: 2048
  context_length: 128
  num_layers: 2
  d_model: 128
  num_heads: 4
  d_ff: 352
  norm_mode: pre_norm
  ffn_type: swiglu
  rope_theta: 10000.0
data:
  train_data_path: ../data/tinystories-local-v1/train.bin
  val_data_path: ../data/tinystories-local-v1/val.bin
  tokenizer_path: ../data/tinystories-local-v1/tokenizer.json
training:
  batch_size: 8
  max_steps: 50
  learning_rate: 0.001
  min_learning_rate: 0.0001
  warmup_steps: 5
  weight_decay: 0.1
  grad_clip: 1.0
  seed: 42
  device: cpu
  eval_interval: 10
  save_interval: 25
output:
  output_dir: ../outputs/tinystories-pilot-v2
