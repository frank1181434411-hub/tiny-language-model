[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-language-model"
dynamic = ["version"]
description = "A small language model learning project, starting with a validated engineering scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
compute = ["torch~=2.11.0", "numpy>=1.26"]

[project.scripts]
tiny-lm = "tiny_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tiny_lm.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Preserve compact imports and single-line optimizer calls as requested.
"src/tiny_lm/optim.py" = ["E501", "I001"]
"src/tiny_lm/losses.py" = ["I001"]
# Keep the scheduler signature and validation tuples on single lines.
"src/tiny_lm/schedule.py" = ["E501"]
"src/tiny_lm/data.py" = ["E501", "I001"]
"tests/test_data.py" = ["E501"]
"src/tiny_lm/model/layers.py" = ["E501", "I001"]
"tests/test_layers.py" = ["E501", "I001"]
"src/tiny_lm/model/attention.py" = ["E501", "I001"]
"tests/test_attention.py" = ["E501", "I001"]

[tool.ruff.format]
# Preserve the requested compact spacing in migrated numerical implementations.
exclude = [
    "src/tiny_lm/model/attention.py",
    "tests/test_attention.py",
    "src/tiny_lm/model/layers.py",
    "tests/test_layers.py",
    "src/tiny_lm/data.py",
    "src/tiny_lm/losses.py",
    "src/tiny_lm/optim.py",
    "src/tiny_lm/schedule.py",
    "tests/test_optim.py",
    "tests/test_schedule.py",
    "tests/test_data.py",
]
