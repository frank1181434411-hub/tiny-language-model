[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-language-model"
dynamic = ["version"]
description = "A small language model learning project, starting with a validated engineering scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
compute = ["torch~=2.11.0"]

[project.scripts]
tiny-lm = "tiny_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tiny_lm.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Keep optimizer calls on one line as requested.
"src/tiny_lm/optim.py" = ["E501"]

[tool.ruff.format]
# Preserve the requested compact spacing in migrated numerical implementations.
exclude = ["src/tiny_lm/losses.py", "src/tiny_lm/optim.py", "tests/test_optim.py"]
