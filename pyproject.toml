[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-language-model"
dynamic = ["version"]
description = "A small language model learning project, starting with a validated engineering scaffold."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
compute = ["torch~=2.11.0", "numpy>=1.26"]
tokenizer = ["regex>=2024.11.6"]
data = ["numpy>=1.26"]

[project.scripts]
tiny-lm = "tiny_lm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.dynamic]
version = {attr = "tiny_lm.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/expand_tinystories.py" = ["E501", "I001"]
"scripts/evaluate_tinystories_heldout.py" = ["E501", "I001"]
"tests/test_expand_tinystories.py" = ["E501", "I001"]
"scripts/evaluate_tinystories.py" = ["E501", "I001"]
"scripts/run_tinystories_pilot.py" = ["E501", "I001"]
"scripts/prepare_tinystories_sample.py" = ["E501", "I001"]
"src/tiny_lm/binding.py" = ["E501", "I001"]
"tests/test_binding.py" = ["E501", "I001"]
"src/tiny_lm/generate.py" = ["E501", "I001"]
"tests/test_generate.py" = ["E501", "I001"]
"tests/test_generate_cli.py" = ["E501", "I001"]
"tests/test_training_cli.py" = ["E501", "I001"]
"src/tiny_lm/cli.py" = ["E501", "I001"]
"tests/test_preprocess_cli.py" = ["E501", "I001"]
"src/tiny_lm/tokenizer/*.py" = ["E501", "I001"]
"tests/test_bpe.py" = ["E501", "I001"]
"tests/test_tokenizer_serialization.py" = ["E501", "I001"]
"tests/test_tokenizer.py" = ["E501", "I001"]
"src/tiny_lm/preprocess.py" = ["E501", "I001"]
"tests/test_preprocess.py" = ["E501", "I001"]
# Preserve compact imports and single-line optimizer calls as requested.
"src/tiny_lm/optim.py" = ["E501", "I001"]
"src/tiny_lm/losses.py" = ["I001"]
# Keep the scheduler signature and validation tuples on single lines.
"src/tiny_lm/schedule.py" = ["E501"]
"src/tiny_lm/data.py" = ["E501", "I001"]
"tests/test_data.py" = ["E501"]
"src/tiny_lm/model/layers.py" = ["E501", "I001"]
"tests/test_layers.py" = ["E501", "I001"]
"src/tiny_lm/model/attention.py" = ["E501", "I001"]
"tests/test_attention.py" = ["E501", "I001"]
"src/tiny_lm/model/transformer.py" = ["E501", "I001"]
"tests/test_transformer.py" = ["E501", "I001"]
"src/tiny_lm/checkpoint.py" = ["E501", "I001"]
"tests/test_checkpoint.py" = ["E501", "I001"]
"src/tiny_lm/train.py" = ["E501", "I001"]
"src/tiny_lm/evaluate.py" = ["E501", "I001"]
"tests/test_training.py" = ["E501", "I001"]

[tool.ruff.format]
# Preserve the requested compact spacing in migrated numerical implementations.
exclude = [
    "scripts/expand_tinystories.py",
    "scripts/evaluate_tinystories_heldout.py",
    "tests/test_expand_tinystories.py",
    "scripts/evaluate_tinystories.py",
    "scripts/run_tinystories_pilot.py",
    "scripts/prepare_tinystories_sample.py",
    "src/tiny_lm/binding.py",
    "tests/test_binding.py",
    "src/tiny_lm/generate.py",
    "tests/test_generate.py",
    "tests/test_generate_cli.py",
    "tests/test_training_cli.py",
    "src/tiny_lm/cli.py",
    "tests/test_preprocess_cli.py",
    "docs/bpe.md",
    "docs/tokenizer.md",
    "docs/preprocess.md",
    "src/tiny_lm/preprocess.py",
    "tests/test_preprocess.py",
    "src/tiny_lm/tokenizer/*.py",
    "tests/test_bpe.py",
    "tests/test_tokenizer_serialization.py",
    "tests/test_tokenizer.py",
    "src/tiny_lm/train.py",
    "src/tiny_lm/evaluate.py",
    "tests/test_training.py",
    "docs/training.md",
    "docs/checkpoint.md",
    "src/tiny_lm/checkpoint.py",
    "tests/test_checkpoint.py",
    "src/tiny_lm/model/transformer.py",
    "tests/test_transformer.py",
    "src/tiny_lm/model/attention.py",
    "tests/test_attention.py",
    "src/tiny_lm/model/layers.py",
    "tests/test_layers.py",
    "src/tiny_lm/data.py",
    "src/tiny_lm/losses.py",
    "src/tiny_lm/optim.py",
    "src/tiny_lm/schedule.py",
    "tests/test_optim.py",
    "tests/test_schedule.py",
    "tests/test_data.py",
]
