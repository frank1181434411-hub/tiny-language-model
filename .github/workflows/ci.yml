name: checks

on:
  push:
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install scaffold and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest

  losses-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU compute dependencies
        run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install project and test tools
        run: python -m pip install -e ".[dev,compute]"
      - name: Verify CPU PyTorch import
        run: python -c "import torch; assert torch.version.cuda is None"
      - name: Test loss numerics and gradients
        run: python -m pytest tests/test_losses.py
